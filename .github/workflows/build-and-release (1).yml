name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: >-
          اسمِ فایل زیپی که می‌خوای مستقیم استفاده بشه (مثلاً dehaat-source.zip یا
          هر اسمِ دیگه‌ای که توی ریشه‌ی ریپو آپلود کردی). اگه خالی بذاری، مثلِ قبل
          خودکار دنبالِ تکه‌های *.partN می‌گرده و به هم می‌چسبونه.
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble / select source zip (secure)
        env:
          ZIP_FILE_INPUT: ${{ github.event.inputs.zip_file }}
        run: |
          set -e
          echo "--- repo root before reassembly ---"
          ls -la

          if [ -n "$ZIP_FILE_INPUT" ]; then
            # ---------- مسیرِ انتخابِ دستیِ فایل زیپ ----------
            echo "فایلِ زیپِ انتخاب‌شده به‌صورتِ دستی: $ZIP_FILE_INPUT"

            if [ ! -f "$ZIP_FILE_INPUT" ]; then
              echo "::error::فایلِ «$ZIP_FILE_INPUT» توی ریشه‌ی ریپو پیدا نشد. مطمئن شو دقیقاً همون اسمی رو زدی که آپلود کردی."
              exit 1
            fi

            if [ "$ZIP_FILE_INPUT" != "dehaat-source.zip" ]; then
              cp "$ZIP_FILE_INPUT" dehaat-source.zip
            fi

            if [ -f "${ZIP_FILE_INPUT}.sha256" ]; then
              echo "در حال بررسی SHA-256..."
              EXPECTED=$(awk '{print $1}' "${ZIP_FILE_INPUT}.sha256")
              ACTUAL=$(sha256sum dehaat-source.zip | awk '{print $1}')
              if [ "$EXPECTED" != "$ACTUAL" ]; then
                echo "::error::چک‌سام مطابقت ندارد! فایل ممکنه ناقص/خراب باشه."
                exit 1
              fi
              echo "چک‌سام تأیید شد ✅ — فایل سالم است."
            else
              echo "::warning::فایلِ چک‌سام برای «$ZIP_FILE_INPUT» پیدا نشد، از بررسی صحت صرف‌نظر شد."
            fi

          else
            # ---------- مسیرِ خودکار و مقاوم: چسباندنِ تکه‌ها بر اساسِ پسوندِ نهایی ----------
            # GitHub وقتی اسمِ فایل تکراری باشه، درستِ قبل از پسوندِ نهایی " (2)" اضافه می‌کنه
            # (مثلاً dehaat-source.zip.part1 -> "dehaat-source.zip (2).part1")
            # پس به‌جایِ تکیه بر اسمِ کاملِ فایل، فقط بر اساسِ پسوندِ نهایی (partN) شناساییِشون می‌کنیم
            # تا فاصله، پرانتز، یا هر پیشوندِ دیگه‌ای هم مشکلی ایجاد نکنه.

            declare -a PART_NUMS
            declare -a PART_FILES

            for f in *; do
              [ -f "$f" ] || continue
              ext="${f##*.}"
              if [[ "$ext" =~ ^[Pp][Aa][Rr][Tt]([0-9]+)$ ]]; then
                PART_NUMS+=("${BASH_REMATCH[1]}")
                PART_FILES+=("$f")
              fi
            done

            if [ "${#PART_FILES[@]}" -eq 0 ]; then
              echo "::error::نه ورودیِ zip_file پر شده، نه هیچ فایلی با پسوندِ .partN توی ریشه‌ی ریپو پیدا شد. یا تکه‌ها رو آپلود کن، یا موقعِ اجرایِ دستیِ ورک‌فلو اسمِ فایل زیپ رو توی ورودیِ zip_file بده."
              exit 1
            fi

            # مرتب‌سازیِ فایل‌ها بر اساسِ شماره‌یِ استخراج‌شده از پسوند (نه بر اساسِ حروفِ اسم)
            mapfile -t SORTED_IDX < <(
              for i in "${!PART_NUMS[@]}"; do
                printf '%s\t%s\n' "${PART_NUMS[$i]}" "$i"
              done | sort -n -k1,1 | cut -f2
            )

            echo "تکه‌های پیدا شده به این ترتیب به هم چسبانده می‌شوند:"
            SORTED_FILES=()
            for i in "${SORTED_IDX[@]}"; do
              SORTED_FILES+=("${PART_FILES[$i]}")
              echo "  part${PART_NUMS[$i]} <- ${PART_FILES[$i]}"
            done

            cat "${SORTED_FILES[@]}" > dehaat-source.zip

            echo "--- سایز فایل بازسازی‌شده ---"
            ls -la dehaat-source.zip

            # پیدا کردنِ فایلِ چک‌سام بر اساسِ پسوندِ نهایی (sha256)، فارغ از اسمِ پایه
            SHA_FILE=""
            for f in *; do
              [ -f "$f" ] || continue
              ext="${f##*.}"
              if [[ "$ext" =~ ^[Ss][Hh][Aa]256$ ]]; then
                SHA_FILE="$f"
                break
              fi
            done

            if [ -n "$SHA_FILE" ]; then
              echo "در حال بررسی SHA-256 با فایل «$SHA_FILE»..."
              EXPECTED=$(awk '{print $1}' "$SHA_FILE")
              ACTUAL=$(sha256sum dehaat-source.zip | awk '{print $1}')
              if [ "$EXPECTED" != "$ACTUAL" ]; then
                echo "::error::چک‌سام مطابقت ندارد! یعنی یکی از تکه‌ها هنگام آپلود خراب/ناقص شده. دوباره آپلودشون کن."
                exit 1
              fi
              echo "چک‌سام تأیید شد ✅ — فایل سالم است."
            else
              echo "::warning::هیچ فایلی با پسوندِ .sha256 پیدا نشد، از بررسی صحت صرف‌نظر شد."
            fi

            # پاک‌سازی تکه‌ها و چک‌سام از دایرکتوری کار (فایل zip نهایی کافیست)
            rm -f "${SORTED_FILES[@]}"
            [ -n "$SHA_FILE" ] && rm -f "$SHA_FILE"
          fi

      - name: Unzip project source
        run: |
          echo "--- repo root before unzip ---"
          ls -la
          if [ ! -f dehaat-source.zip ]; then
            echo "::error::dehaat-source.zip بعد از بازسازی پیدا نشد."
            exit 1
          fi
          unzip -o dehaat-source.zip -d .
          rm -f dehaat-source.zip
          echo "--- repo root after unzip ---"
          ls -la
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts not found after unzip — the zip content isn't at its own root (probably has an extra top-level folder)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: |
          gradle assembleRelease --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk dehaat-v${{ github.run_number }}.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: dehaat-v${{ github.run_number }}.apk
